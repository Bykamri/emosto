server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /api/stories -> http://api:8000/stories (awalan /api dibuang, sama seperti proxy Vite di dev).
    # Alamat backend dipakai lewat variabel + resolver Docker supaya nginx tetap bisa
    # start walau container api belum hidup (nginx tidak langsung gagal "host not found").
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File berhash dari Vite aman di-cache lama; index.html harus selalu diambil ulang.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
